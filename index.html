<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <h1 class="visually-hidden">Login Form Page</h1>

    <div class="form-card">
        <form class="form login-form" action="https://echo.htmlacademy.ru/">
            <h2 class="form__title">Kirish</h2>
            
            <div class="form__group">
                <label class="input-label" for="email">Elektron pochta:</label>
                <input class="form__input" type="email" name="email" id="email" required>
            </div>
            
            <div class="form__group">
                <label class="input-label" for="password">Parol:</label>
                <input class="form__input" type="password" name="password" id="password" required>
            </div>
            
            <div class="checkbox">
                <input class="checkbox__input" id="checkbox" type="checkbox" name="checkbox" required>
                <label class="checkbox__label" for="checkbox">Ro'yxatdan o'tish orqali siz <a href="#">Xizmat shartlari va Maxfiylik siyosati</a>ga rozilik bildirasiz.</label>
            </div>
            
            <button class="submit-btn" type="submit">Kirish</button>
        </form>
        
        <!-- ICONS -->
        <div class="icons">
            <p class="icons__text">Yoki quyidagilar orqali ro'yxatdan o'ting:</p>

            <ul class="icons__list">
                <li class="list__item">
                    <a class="icons__link" href="#">
                        <img src="images/Google.png" alt="" width="24" height="24">
                    </a>
                </li>

                <li class="list__item">
                    <a class="icons__link" href="#">
                        <img src="images/Facebook.png" alt="" width="24" height="24">
                    </a>
                </li>

                <li class="list__item">
                    <a class="icons__link" href="#">
                        <img src="images/GitHub.png" alt="" width="24" height="24">
                    </a>
                </li>

                <li class="list__item">
                    <a class="icons__link" href="#">
                        <img src="images/Apple.png" alt="" width="24" height="24">
                    </a>
                </li>
            </ul>
        </div>
        <!-- /ICONS -->
    </div>
</body>

</html>
